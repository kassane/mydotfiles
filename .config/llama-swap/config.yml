# llama-swap configuration for RTX 3050 Laptop (8GB VRAM, 8192 MiB per nvidia-smi)
# Configuração otimizada para uso com --fit automático + attn_rot (KV cache quantizado)
# Dual binary: llama.cpp for dense models, ik_llama.cpp for MoE models (pinned memory, better expert offload)
#
# Repositório: ~/git/ai-dotfiles/llama-swap/
# Modelos: ~/.llama-models/
# Requer: llama-swap v212+ (Prometheus metrics, SIGHUP reload, reasoning UI, race fix, zstd captures)
# Requer: llama.cpp build b9563+ (mtmd audio/TTS/video, 6 audio preprocessors: whisper/conformer/granite_speech/gemma4a/gemma4ua/qwen3a, LFM2.5 reasoning fix, Gemma4 MTP, Granite4 Vision, KV cache optimizations)
# Requer: ik_llama.cpp v4566+ (bf16 graph reduce fix, threads-mtmd, mtmd checkpoint save/restore)
#
# OTIMIZAÇÕES ik_llama.cpp (modelos MoE e dense offloaded):
#   --k-cache-hadamard / --v-cache-hadamard (-khad/-vhad): Hadamard transform no K/V cache
#     antes da quantização → qualidade muito mais próxima do f16 com cache q4_0/q8_0.
#     Especialmente útil em 6GB VRAM onde q4_0 é necessário para contexto longo.
#   --flash-attn auto: desliga FA automaticamente em contextos curtos (economia em MoE offloaded)
#   --defer-experts: defere mmap de experts no Linux → carregamento mais rápido de modelos MoE


healthCheckTimeout: 300
logLevel: info
logTimeFormat: "rfc3339"
logToStdout: "proxy"
captureBuffer: 15
startPort: 10001
sendLoadingState: false
includeAliasesInList: true
globalTTL: 0

# Macros reutilizáveis
macros:
  "models_dir": "${env.HOME}/.cache/huggingface/hub"
  "media_path": "${env.HOME}/testfiles/vision"
  "templates_dir": "${env.HOME}/Downloads/build"

  # Caminho para o llama-server compilado com CUDA (--fit disponível)
  # Build local em ~/git/llama.cpp/build/bin/llama-server
  "llama_server": "${env.HOME}/.unsloth/llama.cpp/build/bin/llama-server"

  # Caminho para ik_llama.cpp — fork otimizado para MoE (pinned memory, faster expert offload)
  # Build local em ~/git/ik_llama.cpp/build/bin/llama-server
  "ik_llama_server": "${env.HOME}/Downloads/build/bin/llama-server"

  # Caminho para BeeLlama.cpp — fork com DFlash speculative decoding + TurboQuant KV cache
  # Build local em ~/git/beellama.cpp/build/bin/llama-server
  # NOTA: Bee não tem --fit/--fit-margin. Usar --n-gpu-layers 99 para modelos que cabem na VRAM.
  # Requer LD_LIBRARY_PATH apontando para ~/git/beellama.cpp/build/bin/ (libs .so do Bee) — MAS o RPATH já está setado no binário
  "bee_server": "${env.HOME}/git/beellama.cpp/build/bin/llama-server"

  "vllm_bin": "${env.HOME}/.vllm/bin/vllm"

  # ===========================================
  # PARÂMETROS DE INFERÊNCIA (baseados no Unsloth)
  # ===========================================
  # Qwen3.5: temp 0.6-0.7, top_p 0.8-0.9, top_k 20-40

  # Gemma: temp 0.7, top_p 0.9
  # Referência: https://unsloth.ai/docs/models/qwen3.5
  # ===========================================
  # Parâmetros padrão (uso geral)
  "default_temp": "0.7"
  "default_top_p": "0.9"
  "default_top_k": "20"
  "default_min_p": "0.01"
  "default_repeat_penalty": "1.05"

  # Parâmetros para código/tool-calling (mais determinístico)
  "code_temp": "0.6"
  "code_top_p": "0.85"
  "code_top_k": "40"
  "code_min_p": "0.02"
  "code_repeat_penalty": "1.05"

  # Parâmetros para thinking/reasoning
  "think_temp": "0.6"
  "think_top_p": "0.9"
  "think_top_k": "20"
  "think_min_p": "0.0"
  "think_repeat_penalty": "1.0"

  # Contexto para modelos pequenos (cabem inteiros na VRAM)
  # fit-ctx: mínimo garantido, ctx-size: máximo teto
  "small_model_min_ctx": "65536"   # 64K mínimo (tool-calling/agentes)
  "small_model_max_ctx": "131072"  # 128K máximo
  # Contexto para modelos grandes (requerem offload)
  "large_model_min_ctx": "65536"   # 64K mínimo (tool-calling/agentes)
  "large_model_max_ctx": "131072"  # 128K máximo
  # Margem de segurança para VRAM (MiB) - usada pelo --fit-target
  "vram_margin": "512"

  # ===========================================
  # KV CACHE QUANTIZADO + ATTN_ROT
  # ===========================================
  # attn_rot é ativado AUTOMATICAMENTE quando o cache é quantizado
  # (q4_0/q8_0) e n_embd_head % 64 == 0
  # Reduz degradação de velocidade em contextos longos (~37% → ~10%)
  # NOTA: Gemma4 iSWA attn_rot bug FIXED (commit 4eb19514d, b8815+). q4_0 cache works now!
  # ===========================================
  #
  # Compatibilidade attn_rot por modelo:
  #   Qwen3.5-4B/9B   ✅ head_k=256 (256%64==0)
  #   Qwen3-14B        ✅ head_k=128 (128%64==0)
  #   Qwen3.6-35B-A3B  ✅ head_k=128
    #   Nemotron-3-Nano  ✅ head_k=128 (REMOVED — poor quality)
    # Nemotron-Omni-30B ✅ head_k=128 (added 2026-08-25 — upstream-only, ik doesn't support nemotron_h_moe)
  #   Gemma-4 E2B/E4B  ✅ head_k=256, iSWA attn_rot fixed (b8815+)
  #   Gemma-4 26B-MoE  ✅ head_k=256, iSWA attn_rot fixed (b8815+)
  #   LFM2.5-1.2B       ✅ head_k=64 (64%64==0) — dense hybrid
  #   LFM2-24B-A2B     ✅ head_k=128 (128%64==0) — MoE hybrid
  #   LFM2.5-VL-450M   ❌ vision model, manter f16
  #
  # Tipos de cache:
  #   q8_0: ~47% economia vs f16, perda mínima
  #   q4_0: ~72% economia vs f16, mais compressão
  #
  # Escolha: modelos pequenos (fit VRAM) usam q8_0 (saldo perf/mem)
  #          modelos grandes (offload) usam q4_0 (maximizar contexto)
  "small_cache_k": "q8_0"
  "small_cache_v": "q8_0"
  "large_cache_k": "q4_0"
  "large_cache_v": "q4_0"
  "gemma_cache_k": "q4_0"
  "gemma_cache_v": "q4_0"
models:
# -------------------------------------------
# QWEN 9B PAIR — dense hybrids, UPSTREAM llama.cpp
# (dense = upstream per ai-dotfiles docs/BINARIES.md decision rule; ik is MoE-only)
# No spec decode/MTP on GDN hybrids (MTP-NOTES.md; spec buffers aggravate OOM).
# Q4_K_M redownloaded 2026-08-21 (original 2026-08-16 bench used Q5_K_M).
# -------------------------------------------
  "qwen3.5-9b":
    name: "Qwen3.5 9B (Q4_K_M)"
    description: "Dense 9B hybrid (qwen35 arch, GDN), Q4_K_M from unsloth, redownloaded 2026-08-21. Text-only serving for the coding benchmark. Upstream llama.cpp (dense rule); no spec decode (GDN hybrid)."
    env:
      # upstream llama-server needs the unsloth-bundled CUDA runtime on its path,
      # else it silently falls back to CPU (~7 tok/s). Same stanza as qwen3.8-27b.
      - "LD_LIBRARY_PATH=${env.HOME}/.unsloth/llama.cpp/build/bin:${env.HOME}/.unsloth/studio/unsloth_studio/lib64/python3.13/site-packages/nvidia/cu13/lib"

    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/models--unsloth--Qwen3.5-9B-GGUF/snapshots/3885219b6810b007914f3a7950a8d1b469d598a5/Qwen3.5-9B-Q4_K_M.gguf
      --no-mmproj
      --fit on
      --fit-target 512
      --fit-ctx 8192
      # ctx ceiling 32K: upstream allocates KV for the FULL ctx-size — 131072
      # means ~4.3GB q8_0 KV -> CPU offload -> ~7.5 tok/s. Bench needs <=8K;
      # 32K fits weights+KV fully in VRAM. Raise via a :think/agent variant
      # with q4_0 KV if long-context is needed.
      --ctx-size 32768
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --parallel 1
      --temp ${default_temp}
      --top-p ${default_top_p}
      --top-k ${default_top_k}
      --min-p ${default_min_p}
      --repeat-penalty ${default_repeat_penalty}
      --reasoning on
      --cache-type-k ${small_cache_k}
      --cache-type-v ${small_cache_v}
      --flash-attn on
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in: ['text']
      out: ['text']
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~5.3 GB (Q4_K_M)"
      context: "64K-128K (dynamic)"
      vram_usage: "~6.5GB VRAM text-only (q8_0 KV + attn_rot)"
      source: "unsloth/Qwen3.5-9B-GGUF (redownloaded 2026-08-21)"
      kv_cache: "q8_0/q8_0 + attn_rot (head_k=256)"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 8950000000
      context_length: 262144
      quantization: Q4_K_M
      note: "Dense -> upstream llama.cpp (docs/BINARIES.md). No spec decode: GDN recurrent-state + spec buffers OOM (MTP-NOTES.md). Original bench used Q5_K_M."
  "qwen3.8-9b":
    name: "Qwen3.8 9B (Q4_K_M Distill)"
    description: "Dense 9B hybrid (GDN + attention every 4th block), Q4_K_M Distill from empero-ai, redownloaded 2026-08-21. Text-only. Upstream llama.cpp (dense rule); no spec decode (GDN hybrid, same family constraint as qwen3.8-27b)."
    env:
      # upstream llama-server needs the unsloth-bundled CUDA runtime on its path,
      # else it silently falls back to CPU (~7 tok/s). Same stanza as qwen3.8-27b.
      - "LD_LIBRARY_PATH=${env.HOME}/.unsloth/llama.cpp/build/bin:${env.HOME}/.unsloth/studio/unsloth_studio/lib64/python3.13/site-packages/nvidia/cu13/lib"

    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/models--empero-ai--Qwen3.8-9B-Distill-GGUF/snapshots/760121cd70bb4c36b2b5ec58eb765e0df5987efe/Qwen3.8-9B-Q4_K_M.gguf
      --no-mmproj
      --fit on
      --fit-target 512
      --fit-ctx 8192
      # ctx ceiling 32K: upstream allocates KV for the FULL ctx-size — 131072
      # means ~4.3GB q8_0 KV -> CPU offload -> ~7.5 tok/s. Bench needs <=8K;
      # 32K fits weights+KV fully in VRAM. Raise via a :think/agent variant
      # with q4_0 KV if long-context is needed.
      --ctx-size 32768
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --jinja
      --parallel 1
      --temp ${default_temp}
      --top-p ${default_top_p}
      --top-k ${default_top_k}
      --min-p ${default_min_p}
      --repeat-penalty ${default_repeat_penalty}
      --reasoning on
      --cache-type-k ${small_cache_k}
      --cache-type-v ${small_cache_v}
      --flash-attn on
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.9
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.6
          top_p: 0.9
    ttl: 60
    health_check_timeout: 300
    capabilities:
      in: ['text']
      out: ['text']
      tools: true
      reranker: false
      context: 131072
    metadata:
      size: "~5.4 GB (Q4_K_M)"
      context: "64K-128K (dynamic)"
      vram_usage: "~6.6GB VRAM text-only (q8_0 KV + attn_rot)"
      source: "empero-ai/Qwen3.8-9B-Distill-GGUF (redownloaded 2026-08-21)"
      kv_cache: "q8_0/q8_0 + attn_rot"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        audio: false
        image: false
      architecture: qwen35
      parameters: 8950000000
      context_length: 262144
      quantization: Q4_K_M
      note: "Dense -> upstream llama.cpp; qwen-fixed-chat-template v22.3 override (aligned with qwen3.5-9b 2026-08-21). No spec decode (GDN family). Original bench used empero-ai Q5_K_M non-Distill."
