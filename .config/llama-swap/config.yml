# -------------------------------------------
  "qwen-image-2.1":
    name: "Qwen-Image 2.1 Turbo (Q4_K_M)"
    description: "7B text-to-image diffusion served by stable-diffusion.cpp sd-server (llama-server cannot run diffusion models). Qwen3-VL-8B TE + 2.1-specific VAE."
    tags:
      - "image"
    env:
      # PrismML fork needs CUDA 12 runtime from stable-diffusion.cpp dir.
      - "LD_LIBRARY_PATH=${env.HOME}/.unsloth/stable-diffusion.cpp/sd-master-951-f89d9b1-uafac7a7-bin-Linux-Ubuntu-22.04-x86_64-cuda12"
    cmd: |
      ${sd_server} --listen-port ${PORT}
      --diffusion-model ${models_dir}/models--unsloth--Qwen-Image-2.1-Turbo-GGUF/snapshots/5d1f9f759ea877ae556cda88dbec958b62ad3809/qwen-image-2.1-turbo-Q4_K_M.gguf
      --vae ${models_dir}/models--unsloth--Qwen-Image-2.1-FP8/snapshots/bb21a8ba7f0371c19ad1f72c82a5e8fc10f39939/vae/qwen_image_2.1_vae_bf16.safetensors
      --llm ${models_dir}/models--unsloth--Qwen3-VL-8B-Instruct-GGUF/snapshots/b93a7ee713758252c555be4210c00540df954dc2/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
      # editing requires Qwen3-VL vision weights (docs: pass mmproj with --llm_vision)
      --llm_vision ${models_dir}/models--unsloth--Qwen3-VL-8B-Instruct-GGUF/snapshots/b93a7ee713758252c555be4210c00540df954dc2/mmproj-F16.gguf
      # 8GB VRAM: diffusion(4.0G)+TE(5.1G) can't co-reside -> stage through RAM
      --offload-to-cpu
      # full-frame VAE decode needs 8771MB > the whole 8192MB card, so decode can
      # never fit -> the silent OOM fallback halves the image and leaves a hard seam
      # at x=W/2 (green dots). Tiling blends instead: 512px tiles, 0.5 overlap.
      # 951 measures tile-size in IMAGE pixels (min 64 per axis); the old 32x32
      # (813 latent-unit semantics) made ref-image encode fail:
      # "VAE tile size must be at least 64 image pixels" -> "returned no results".
      --vae-tiling
      --vae-tile-size 512x512
      --vae-tile-overlap 0.5
      --sampling-method euler
      --diffusion-fa
      --cfg-scale 1.0
      --sigmas "1.0,0.978453,0.95418,0.926626,0.89508,0.845148,0.704534,0.414568,0.0"
      -W 1024 -H 1024
      --steps 8
    checkEndpoint: /v1/models
    health_check_timeout: 300
    ttl: 600
    capabilities:
      in: ['text']
      out: ['image']


  "wan2.2-ti2v-5b":
    name: "Wan2.2 TI2V 5B (Q4_K_M)"
    description: "5B text-to-video diffusion served by stable-diffusion.cpp sd-server (llama-server cannot run diffusion/video models). 720p-only checkpoint; native route /sdcpp/v1/vid_gen, so this is not an OpenAI chat or images model."
    tags: ["video", "wan", "diffusion"]
    env:
      # master-951 dir ships libggml-*.so + the cu12 runtime (libcublasLt/libcublas/libcudart copied in);
      # the sd-master-813 builds cannot decode Wan VAE on 8GB (capacity check needs 15.0GB)
      - "LD_LIBRARY_PATH=${env.HOME}/.unsloth/stable-diffusion.cpp/sd-master-951-f89d9b1-u25ac1fa-bin-Linux-Ubuntu-22.04-x86_64-cuda12"
    cmd: |
      ${env.HOME}/.unsloth/stable-diffusion.cpp/sd-master-951-f89d9b1-u25ac1fa-bin-Linux-Ubuntu-22.04-x86_64-cuda12/sd-server --listen-port ${PORT}
      --diffusion-model ${models_dir}/models--unsloth--Wan2.2-TI2V-5B-GGUF/snapshots/b5c2a3816e7056e57e200f6be726fb36ce523b49/Wan2.2-TI2V-5B-Q4_K_M.gguf
      # companion VAE (converted from the original .pth) mirrored in the same snapshot
      --vae ${models_dir}/models--unsloth--Wan2.2-TI2V-5B-GGUF/snapshots/b5c2a3816e7056e57e200f6be726fb36ce523b49/VAE/Wan2.2_VAE.safetensors
      # umT5-XXL text encoder: Diffusers bf16 shards addressed by their safetensors index
      --t5xxl ${models_dir}/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers/snapshots/b8fff7315c768468a5333511427288870b2e9635/text_encoder/model.safetensors.index.json
      # no --tokenizer: it binds to slot 'main' and fails the build ("does not target an
      # active, supported text encoder"); without it sd-server builds the Wan context fine
      # 8GB VRAM: umT5 (10.7G bf16) + DiT can't co-reside -> stage through RAM
      --offload-to-cpu
      # video VAE decode is the VRAM hog: tile in space (vae) and in time (temporal)
      --vae-tiling
      --temporal-tiling
      --diffusion-fa
      # direct 3D convs replace im2col (+~6.3GB graph buffer): measured decode 70.3s vs 104.4s per 9f clip
      --vae-conv-direct
      # docs/wan.md Wan2.2 TI2V 5B example combo; this build has no built-in Wan negative prompt
      --sampling-method euler
      --cfg-scale 6.0
      --flow-shift 3.0
      -W 1280 -H 704
      --video-frames 81
      --fps 24
      -n "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"
    checkEndpoint: /v1/models
    health_check_timeout: 300
    ttl: 600
    capabilities:
      in: ['text']
      out: ['video']
    metadata:
      size: "~3.2 GB Q4_K_M DiT + 1.3 GB F16 VAE + 10.7 GB umT5 bf16 (CPU-staged)"
      architecture: wan2.2-ti2v
      quantization: "Q4_K_M DiT, F16 VAE, bf16 umT5"
      source: "unsloth/Wan2.2-TI2V-5B-GGUF (QuantStack mirror) + Wan-AI/Wan2.2-TI2V-5B-Diffusers (umT5 TE + tokenizer)"
      endpoint: "native sd-server API via llama-swap: POST /upstream/wan2.2-ti2v-5b/sdcpp/v1/vid_gen; also /sdcpp/v1/img_gen, /sdcpp/v1/jobs/{id}, /sdcpp/v1/capabilities, /sdcpp/v1/vid_gen"
      server: "stable-diffusion.cpp sd-master-951 (unslothai release master-951-f89d9b1-u25ac1fa) — REQUIRED: sd-master-813 fails wan_vae decode capacity check on 8GB (need 15.0GB/8.9GB conv-direct vs 7.2GB free) and logs a fatal-ish 5-D patch_embedding gguf error; 951 has both fixed (verified: 9f/720p generates end-to-end)"
      resolution: "720p-only: 1280x704 (landscape) or 704x1280 (portrait); frames must be 4k+1"
      note: "--video-frames 81 = 3.4s @24fps for the 8GB card; 121 = 5.04s is the quality target once 81 is proven to fit. Request needs explicit \"output_format\":\"avi\" (only supported format) or 400; async 202 -> poll /sdcpp/v1/jobs/{id}. Sampling ~4.3s/it@720p6steps; VAE decode is the long pole (~70s/9f conv-direct). --vae-conv-direct required for both speed and capacity"


