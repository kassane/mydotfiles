      note: "RAM staging ~27.6GB. Resolution 704x448x22f (trained bucket; 640x384 was off-bucket). Steps 8 is the checkpoint's training; do not raise past 10. Cold-boot jobs can 404 - warm via GET /upstream/minimax-h3-turbo/v1/models first (heretic_video.py does this)."

