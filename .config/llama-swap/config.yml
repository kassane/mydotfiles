      reranker: false
      context: 131072
    metadata:
      size: "~2.87 GB (Q8_0)"
      context: "64K-128K (dynamic)"
      vram_usage: "~4.6GB VRAM (model 2.87GB + q4_0 KV 131K + compute)"
      source: "Abiray/LFM2.5-2.6B-Heretic-Abliterated-GGUF (Q8_0)"
      kv_cache: "q4_0"
      features:
        completion: true
        tools: true
        thinking: true
        vision: false
        embedding: false
        insert: false
        audio: false
        image: false
      architecture: lfm2
      parameters: 2690000000
      context_length: 131072
      embedding_length: 2048
      quantization: Q8_0
