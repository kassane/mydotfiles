        --metrics
    ttl: 300
    capabilities:
      in:
        - 'text'
      out: []
      tools: false
      reranker: false
      context: 512
    metadata:
      architecture: nomic-bert
      parameters: 475000000
      context_length: 512
      embedding_length: 768
      quantization: Q4_K_M
      size: "~0.33 GB (Q4_K_M)"
      vram_usage: "~0.1GB (CPU-only, -ngl 0, CUDA ctx overhead only)"
      source: "nomic-ai/nomic-embed-text-v2-moe-GGUF (Q8_0)"
