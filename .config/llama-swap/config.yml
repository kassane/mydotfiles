      note: "Recipe source: leejet/stable-diffusion.cpp discussion #1243 (FastWan author): 3-step euler + lcm scheduler + cfg 1 + flow-shift 3.0 + tiny TAE = coherent video in ~30s on 8GB (base model at 6-8 steps mushes motion and tints green; even 20 steps stays painterly). TAE trades decode fidelity for VRAM; for sharper frames try base wan2.2-ti2v-5b --steps 50. Like all wan entries here: needs the 8GB card to itself (shared GPU crashed 81f base runs mid-decode)."


