hooks:
  on_startup:
    preload: []

# ============================================
# SWAP MATRIX (v202+)
# ============================================
# O solver determina automaticamente qual combinação de modelos
# pode rodar simultaneamente e quais descarregar quando necessário.
#
# ⚠️ REGRA CRÍTICA DE COEXISTÊNCIA:
# Embedding e reranker (nomic, lfmemb, lfmcol) são CPU-only (~0.5GB total)
# e NÃO consomem VRAM. Devem coexistir com QUALQUER LLM — leve ou pesado.
# Todos os sets que agrupam LLMs DEVEM incluir as vars de embedding/reranker
# no & (AND). Se uma var de embedding falta de um set, o solver trata
# o embedding e o LLM como mutuamente exclusivos, causando ping-pong
# de eviction (embedding evicta LLM cost 9+, LLM evicta embedding cost 1).
#
# Exemplo: heavy: "(qw36 | orn35) & (nomic | lfmemb | lfmcol)"
# Veja references/new-model-workflow.md §6 para detalhes completos.
# ============================================

matrix:
  vars:
    # MoE coding/agent (best overall — 40.3 tok/s, ubatch=1024, reasoning-budget 8192)
    qw36: qwen3.6-35b-a3b-uncensored-heretic
    # Small LFM (toolcall 9/10)
    # lfm26: lfm2.5-2.6b-heretic  # model entry removed, re-add when available
    # K2-Horizon 36B MoE (Q3_K_M, HF cache)
    k2h: k2-horizon-36b
    k2h7: k2-horizon-7b
    # Embedding (CPU-only, ~0.5GB)
    nomic: nomic-embed-text-v2-moe
    # LFM2.5 8B MoE (UD-Q4_K_XL, HF cache)
    lfm8: lfm2-24b-a2b
    # Qwen3-Coder 30B A3B (APEX, coding-focused)
    qcr30: qwen3-coder-30b
    # Qwen3.8 35B-A3B Distill (Q4_K_M, same arch as ornith)
    q38d: qwen3.8-35b
    # Qwen3.5 4B (Q8_0, HF cache)
    q35: qwen3.5-4b
    # ASR (HF cache)
    asr: qwen3-asr-0.6b
    # Image
    img: qwen-image-2.1

  sets:
    # MoE sozinho (agente/codegen)
    main: qw36 | qcr30
    # LFM pequeno sozinho
    # lfm_only: lfm26  # disabled: lfm2.5-2.6b-heretic not in models
    # MoE + Embedding (RAG/semantic search)
    main_embed: qw36 & nomic
    # Embedding sozinho (RAG indexing)
    embed_only: nomic
  # Custo de eviction (modelos mais caros pra recarregar = prioridade pra ficar)
  evict_costs:
    qw36: 9
    qcr30: 9  # same size as heretic/ornith
    q35: 2
    lfm8: 4
    asr: 2
    img: 2
    # lfm26: 2  # disabled: lfm2.5-2.6b-heretic not in models
    nomic: 1
    k2h: 9
    k2h7: 5
