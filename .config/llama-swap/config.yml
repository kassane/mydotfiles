      -W 704 -H 448
      --video-frames 22
      --fps 24
    checkEndpoint: /v1/models
    health_check_timeout: 300
    ttl: 120
    capabilities:
      in: ['text']
      out: ['video']
    metadata:
      source: "ChrisColeTech/minimax-h3-turbo-GGUF minimax_h3_fl2va_turbo_Q3_K_M (lightx2v 8step v1.0 baked, fp8_scaled -> Q3_K_M)"
