# LFM2.5-2.6B-HERETIC-ABLITERATED — Liquid AI dense hybrid (NEW 2026-08-18)
# 2.69B params, lfm2 arch — upstream llama.cpp ONLY (ik does not support lfm2).
# Q8_0 = 2.87GB — fits entirely in VRAM. GGUF has empty chat_template → lfm2.5-chat-template.jinja.
# Heretic-abliterated = refusal-removed variant by Abiray.
# -------------------------------------------
  "lfm2.5-2.6b-heretic":
    name: "LFM 2.5 2.6B heretic"
    description: "Liquid AI on-device agentic model. 2.6B dense hybrid, 128K ctx, 16 languages. Abliterated (heretic). Agentic RL trained inside Hermes Agent."
    env:
      - "LD_LIBRARY_PATH=${env.HOME}/.unsloth/llama.cpp/build/bin:${env.HOME}/.unsloth/studio/unsloth_studio/lib64/python3.13/site-packages/nvidia/cu13/lib"
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${models_dir}/models--Abiray--LFM2.5-2.6B-Heretic-Abliterated-GGUF/snapshots/1eaf992a33529fc839cbeca32109a9c4c43b57c4/LFM2.5-2.6B-heretic-Q8_0.gguf
      --fit on
      --fit-ctx 131072
      --ctx-size 131072
      --parallel 1
      --reasoning on
      --chat-template-file ${templates_dir}/lfm2.5-chat-template.jinja
      --temp 0.1
      --top-p 0.9
      --top-k 50
      --min-p 0.0
      --repeat-penalty 1.1
      --cache-type-k q4_0
      --cache-type-v q4_0
      --flash-attn on
      --jinja
      --metrics
    filters:
      stripParams: "temperature, top_p"
      setParamsByID:
        "${MODEL_ID}":
          temperature: 0.1
          top_p: 0.9
        "${MODEL_ID}:think":
