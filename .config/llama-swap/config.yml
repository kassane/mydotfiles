      architecture: wan.2.2-ti2v-fastwan (distilled)
      quantization: "Q8_0 DiT distilled, TAE decoder, bf16 umT5"
      source: "Green-Sky/FastWan2.2-TI2V-5B-FullAttn-GGUF + madebyollin/taehv taew2_2"
