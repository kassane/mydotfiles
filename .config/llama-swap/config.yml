      --no-mmproj-offload
      --fit
      --fit-margin 512
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --parallel 1
      --parallel-tool-calls
      --ctx-size ${small_model_max_ctx}
      --temp ${default_temp}
      --top-p ${default_top_p}
      --top-k ${default_top_k}
      --min-p ${default_min_p}
