      # tiny autoencoder for wan2.2-TI2V-5B (docs/taesd.md TAEHV #937): decode needs MBs of VRAM, ~seconds
      --tae ${models_dir}/models--madebyollin--taehv/snapshots/taew2_2/taew2_2.safetensors
