# -------------------------------------------
# Qwen3.8-27B — dense multimodal (vision), IQ1_S extreme quant (5.8GB) + mmproj F16 (885MB)
# qwen35 arch (same as qwen3.5-4b). Fits 8GB VRAM only at IQ1_S; vision via /v1/chat/completions
# with image_url content blocks. Upstream llama_server (dense, no ik MoE offload needed).
  "qwen3.8-27b":
    name: "Qwen3.8 27B"
    description: "Qwen3.8 27B dense hybrid (Gated Delta Net + attention every 4th block), UD-IQ1_S quant (extreme 1-bit, 5.8GB) + mmproj F16 (885MB). Vision + text. Fits 8GB VRAM tight. NO MTP/spec decode: GDN recurrent-state buffer (~1.3GB) + draft head copy would OOM (ai-dotfiles MTP-NOTES). Thinking-on by default (xhigh effort) in template — filtered off for base, :think variant, --reasoning-effort low caps budget."
    env:
      - "LD_LIBRARY_PATH=${env.HOME}/.unsloth/llama.cpp/build/bin:${env.HOME}/.unsloth/studio/unsloth_studio/lib64/python3.13/site-packages/nvidia/cu13/lib"
    cmd: |
      ${llama_server} --port ${PORT}
      --model ${env.HOME}/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-UD-IQ1_S.gguf
      --mmproj ${env.HOME}/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/mmproj-F16.gguf
      --jinja
      --chat-template-file ${templates_dir}/qwen-fixed-chat-template.jinja
      --reasoning on
      --reasoning-effort low
      --reasoning-format deepseek
      --fit on
      -fa on
      --fit-target 1536
      --no-mmproj-offload
      --parallel 1
      --ctx-size 32768
      --temp 0.7
      --top-p 0.95
      --top-k 20
      --min-p 0
      --repeat-penalty 1.0
      --cache-type-k ${large_cache_k}
      --cache-type-v ${large_cache_v}
      --flash-attn on
      --n-predict -1
      --ubatch-size 1024
      --reasoning-budget 768
      --reasoning-budget-message "Now answer directly."
      --metrics
    filters:
      stripParams: "temperature, top_p, top_k, min_p"
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: false
          temperature: 0.7
          top_p: 0.95
          top_k: 20
          min_p: 0
        "${MODEL_ID}:think":
          chat_template_kwargs:
            enable_thinking: true
          temperature: 0.7
          top_p: 0.95
          top_k: 20
          min_p: 0
    ttl: 600
    health_check_timeout: 600
    capabilities:
      in:
        - 'text'
        - 'image'
      out:
        - 'text'
      tools: true
      reranker: false
      context: 131072
    metadata:
      architecture: qwen35
      parameters: 27000000000
      context_length: 131072
      embedding_length: 128
      quantization: UD-IQ1_S
      size: "~6.7 GB (5.8GB model + 885MB mmproj)"
      vram_usage: "~7GB (IQ1_S fits 8GB, tight)"
      source: "unsloth/Qwen3.8-27B-GGUF"
      features:
        completion: true
        tools: true
        thinking: true
        vision: true
        insert: false
        audio: false
        image: true
      note: "IQ1_S is an extreme 1-bit quant — expect heavy quality loss. Added 2026-08-20 after .lmstudio removal + config migration to .unsloth paths."

  "nomic-embed-text-v2-moe":
    name: "Nomic Embed v2"
    description: "Multilingual MoE text embedding model that excels at multilingual retrieval, supporting ~100 languages with state-of-the-art performance at the 300M parameter scale."
